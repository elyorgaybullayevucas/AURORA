<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 470" width="660" height="470" font-family="Helvetica, Arial, sans-serif">
<defs>
  <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
    <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#1b2a3a" flood-opacity="0.22"/>
  </filter>
  <clipPath id="cDE"><circle cx="0" cy="0" r="27"/></clipPath>
  <clipPath id="cS"><circle cx="0" cy="0" r="23"/></clipPath>
  <marker id="mG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2e8b57"/></marker>
  <marker id="mR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c0392b"/></marker>
  <marker id="mK" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7a8794"/></marker>
  <marker id="mQ" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2f6aa5"/></marker>
  <style>
    .n{font-size:12.5px;font-weight:700;fill:#15212c;text-anchor:middle}
    .e{font-size:10px;font-weight:700}
    .d{font-size:9.5px;fill:#3b4752}
    .c{font-size:10px;fill:#5b6670}
  </style>
</defs>
<rect width="660" height="470" fill="#ffffff"/>

<!-- query -->
<g transform="translate(150 12)">
  <rect x="0" y="0" width="300" height="34" rx="10" fill="#eef5fc" stroke="#2f6aa5" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="150" y="22" font-size="13" font-weight="700" font-style="italic" fill="#1d4e79" text-anchor="middle">Whom will Germany consult on Apr 14?</text>
</g>

<!-- edges: France, regular rhythm (green) -->
<path d="M196 196 C 160 150, 120 128, 98 112" stroke="#2e8b57" stroke-width="2.4" fill="none" marker-end="url(#mG)"/>
<g transform="translate(118 140)">
  <rect x="0" y="0" width="98" height="44" rx="7" fill="#ffffff" stroke="#2e8b57" stroke-width="1.3" filter="url(#sh)"/>
  <text class="e" x="49" y="15" fill="#2e8b57" text-anchor="middle">consult</text>
  <text class="d" x="49" y="28" text-anchor="middle">Jan 15 · Feb 14</text>
  <text class="d" x="49" y="39" text-anchor="middle">Mar 16</text>
</g>

<!-- edges: Turkey, recent bursts (red) -->
<path d="M262 196 C 300 150, 360 126, 392 112" stroke="#c0392b" stroke-width="2.4" fill="none" marker-end="url(#mR)"/>
<g transform="translate(276 136)">
  <rect x="0" y="0" width="110" height="44" rx="7" fill="#ffffff" stroke="#c0392b" stroke-width="1.3" filter="url(#sh)"/>
  <text class="e" x="55" y="15" fill="#c0392b" text-anchor="middle">consult</text>
  <text class="d" x="55" y="28" text-anchor="middle">Mar 28 · Apr 2</text>
  <text class="d" x="55" y="39" text-anchor="middle">Apr 6 · Apr 9</text>
</g>

<!-- context edges (grey) -->
<path d="M200 236 C 160 260, 130 270, 104 282" stroke="#7a8794" stroke-width="1.6" fill="none" marker-end="url(#mK)"/>
<g transform="translate(112 246)"><rect x="0" y="0" width="80" height="30" rx="6" fill="#fff" stroke="#9aa4ac" filter="url(#sh)"/><text class="e" x="40" y="13" fill="#5b6670" text-anchor="middle">sign agreement</text><text class="d" x="40" y="24" text-anchor="middle">Feb 20</text></g>
<path d="M258 236 C 300 262, 350 272, 384 280" stroke="#7a8794" stroke-width="1.6" fill="none" marker-end="url(#mK)"/>
<g transform="translate(290 252)"><rect x="0" y="0" width="80" height="30" rx="6" fill="#fff" stroke="#9aa4ac" filter="url(#sh)"/><text class="e" x="40" y="13" fill="#5b6670" text-anchor="middle">criticise</text><text class="d" x="40" y="24" text-anchor="middle">Mar 1</text></g>

<!-- query arrow -->
<path d="M230 192 L230 52" stroke="#2f6aa5" stroke-width="1.4" stroke-dasharray="5 4" fill="none" marker-end="url(#mQ)"/>

<!-- Germany (subject) -->
<g transform="translate(230 216)" filter="url(#sh)">
  <g clip-path="url(#cDE)"><rect x="-27" y="-27" width="54" height="18" fill="#1a1a1a"/><rect x="-27" y="-9" width="54" height="18" fill="#dd0000"/><rect x="-27" y="9" width="54" height="18" fill="#ffce00"/></g>
  <circle r="27" fill="none" stroke="#2f6aa5" stroke-width="2.5"/>
</g>
<text class="n" x="230" y="262">Germany</text>

<!-- France (answer) -->
<g transform="translate(74 96)" filter="url(#sh)">
  <g clip-path="url(#cS)"><rect x="-23" y="-23" width="16" height="46" fill="#0055a4"/><rect x="-7" y="-23" width="15" height="46" fill="#ffffff"/><rect x="8" y="-23" width="15" height="46" fill="#ef4135"/></g>
  <circle r="23" fill="none" stroke="#2e8b57" stroke-width="3"/>
</g>
<text class="n" x="74" y="136">France</text>

<!-- Turkey (distractor) -->
<g transform="translate(414 96)" filter="url(#sh)">
  <g clip-path="url(#cS)">
    <rect x="-23" y="-23" width="46" height="46" fill="#e30a17"/>
    <circle cx="-3" cy="0" r="10" fill="#ffffff"/><circle cx="0" cy="0" r="8" fill="#e30a17"/>
    <path d="M9 0 L4.5 1.5 L5 -3 L2 1 L6.5 2.5 Z" fill="#ffffff" transform="translate(1 -1)"/>
  </g>
  <circle r="23" fill="none" stroke="#c0392b" stroke-width="3"/>
</g>
<text class="n" x="414" y="136">Turkey</text>

<!-- Italy, Poland: structural context -->
<g transform="translate(80 296)" filter="url(#sh)">
  <g clip-path="url(#cS)"><rect x="-23" y="-23" width="16" height="46" fill="#009246"/><rect x="-7" y="-23" width="15" height="46" fill="#ffffff"/><rect x="8" y="-23" width="15" height="46" fill="#ce2b37"/></g>
  <circle r="23" fill="none" stroke="#9aa4ac" stroke-width="2"/>
</g>
<text class="n" x="80" y="336">Italy</text>
<g transform="translate(408 292)" filter="url(#sh)">
  <g clip-path="url(#cS)"><rect x="-23" y="-23" width="46" height="23" fill="#ffffff"/><rect x="-23" y="0" width="46" height="23" fill="#dc143c"/></g>
  <circle r="23" fill="none" stroke="#9aa4ac" stroke-width="2"/>
</g>
<text class="n" x="408" y="332">Poland</text>

<!-- ═══ right: what each scorer concludes ═══ -->
<g transform="translate(470 160)">
  <rect x="0" y="0" width="180" height="70" rx="10" fill="#fdecea" stroke="#c0392b" stroke-width="1.3" filter="url(#sh)"/>
  <text x="12" y="18" font-size="11" font-weight="700" fill="#c0392b">Monotone recency × frequency</text>
  <text x="12" y="36" font-size="10" fill="#3b4752">Turkey: 4 events, last 5 days ago</text>
  <text x="12" y="50" font-size="10" fill="#3b4752">France: 3 events, last 29 days ago</text>
  <text x="12" y="64" font-size="10.5" font-weight="700" fill="#c0392b">→ Turkey   ✗</text>
</g>
<g transform="translate(470 248)">
  <rect x="0" y="0" width="180" height="70" rx="10" fill="#eaf6ef" stroke="#2e8b57" stroke-width="1.3" filter="url(#sh)"/>
  <text x="12" y="18" font-size="11" font-weight="700" fill="#2e8b57">PRISM: full inter-arrival pattern</text>
  <text x="12" y="36" font-size="10" fill="#3b4752">France recurs every ~30 days</text>
  <text x="12" y="50" font-size="10" fill="#3b4752">and is due again now</text>
  <text x="12" y="64" font-size="10.5" font-weight="700" fill="#2e8b57">→ France   ✓</text>
</g>

<!-- ═══ bottom: the two histories on one time axis ═══ -->
<g transform="translate(20 362)">
  <rect x="0" y="0" width="620" height="96" rx="10" fill="#f8f9fb" stroke="#e1e5ea"/>
  <text x="12" y="18" font-size="10.5" font-weight="700" fill="#15212c">Observed history before the query</text>
  <line x1="78" y1="44" x2="586" y2="44" stroke="#bfd8c7" stroke-width="2"/>
  <line x1="78" y1="74" x2="586" y2="74" stroke="#efc3be" stroke-width="2"/>
  <text x="12" y="48" font-size="10.5" font-weight="700" fill="#2e8b57">France</text>
  <text x="12" y="78" font-size="10.5" font-weight="700" fill="#c0392b">Turkey</text>
  <!-- axis: Jan 1 at x=90, Apr 14 at x=574; 104 days over 484 px -> 4.65 px/day -->
  <g fill="#2e8b57"><rect x="153" y="35" width="4" height="18" rx="2"/><rect x="292" y="35" width="4" height="18" rx="2"/><rect x="437" y="35" width="4" height="18" rx="2"/></g>
  <g fill="#c0392b"><rect x="493" y="65" width="4" height="18" rx="2"/><rect x="516" y="65" width="4" height="18" rx="2"/><rect x="535" y="65" width="4" height="18" rx="2"/><rect x="549" y="65" width="4" height="18" rx="2"/></g>
  <line x1="574" y1="28" x2="574" y2="86" stroke="#2f6aa5" stroke-width="1.6" stroke-dasharray="4 3"/>
  <text x="561" y="24" font-size="9.5" font-weight="700" fill="#2f6aa5">Apr 14</text>
  <path d="M441 60 L572 60" stroke="#2e8b57" stroke-width="1.2" stroke-dasharray="3 3" fill="none"/>
  <text x="466" y="56" font-size="9" fill="#2e8b57">next due ≈ Apr 15</text>
  <text x="90" y="92" font-size="9" fill="#7a8794">Jan</text><text x="230" y="92" font-size="9" fill="#7a8794">Feb</text>
  <text x="360" y="92" font-size="9" fill="#7a8794">Mar</text><text x="500" y="92" font-size="9" fill="#7a8794">Apr</text>
</g>
</svg>
