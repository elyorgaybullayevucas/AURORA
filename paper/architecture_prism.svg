    <rect x="0" y="0" width="112" height="128" rx="10" fill="#fff" stroke="#b6c6d2"/>
    <g class="eg">
      <path d="M22 26 L62 48"/><path d="M22 26 L24 62"/><path d="M62 48 L84 28"/>
      <path d="M62 48 L50 82"/><path d="M24 62 L50 82"/><path d="M24 62 L24 104"/>
      <path d="M50 82 L88 104"/><path d="M24 104 L88 104"/>
    </g>
    <circle cx="22" cy="26" r="8" fill="#1d4e79"/><text class="nl" x="22" y="29" fill="#fff">s</text>
    <circle cx="84" cy="28" r="7" fill="#a9c8e0"/><circle cx="62" cy="48" r="7" fill="#a9c8e0"/>
    <circle cx="24" cy="62" r="7" fill="#a9c8e0"/><circle cx="50" cy="82" r="7" fill="#a9c8e0"/>
    <circle cx="24" cy="104" r="7" fill="#a9c8e0"/><circle cx="88" cy="104" r="7" fill="#a9c8e0"/>
  </g>
</defs>
<rect width="1600" height="880" fill="#fff"/>

<text class="ttl" x="24" y="30">PRISM: an unconstrained history expert and a structural expert, normalised separately and mixed</text>
<text class="sub" x="24" y="48">query (s, r, ?, t) · only facts strictly before t are used · d = 200 · three GCN layers · history window H = 10 (5 on GDELT)</text>

<!-- ═════════════ STRUCTURAL EXPERT (left) ═════════════ -->
<rect x="18" y="64" width="560" height="452" rx="12" fill="#eef4fa" stroke="#bcd3e6"/>
<text class="band" x="34" y="84" fill="#2c5f8a">STRUCTURAL EXPERT</text>

<line x1="40" y1="100" x2="556" y2="100" stroke="#1f2a33" stroke-width="1.3" marker-end="url(#a)"/>
<text class="m" x="58" y="96">t−H</text><text class="m" x="208" y="96">t−H+1</text>
<text class="m" x="394" y="96">t−1</text><text class="s" x="520" y="94">time</text>

<use href="#snap" x="34" y="108"/>
<use href="#snap" x="184" y="108"/>
<text class="h" x="330" y="176">···</text>
<use href="#snap" x="370" y="108"/>

<!-- evolver row -->
<g>
  <rect class="bx" x="34" y="256" width="112" height="46" rx="5"/>
  <text class="t" x="44" y="275">GCN ×3, mean‖max</text><text class="s" x="44" y="292">active ‖ stable</text>
  <rect class="bx" x="184" y="256" width="112" height="46" rx="5"/>
  <text class="t" x="194" y="275">GCN ×3, mean‖max</text><text class="s" x="194" y="292">active ‖ stable</text>
  <rect class="bx" x="370" y="256" width="112" height="46" rx="5"/>
  <text class="t" x="380" y="275">GCN ×3, mean‖max</text><text class="s" x="380" y="292">active ‖ stable</text>
</g>
<path class="ar" d="M90 238 L90 252"/><path class="ar" d="M240 238 L240 252"/><path class="ar" d="M426 238 L426 252"/>
<path class="ar" d="M148 279 L180 279"/><path class="ar" d="M298 279 L330 279"/><path class="ar" d="M340 279 L366 279"/>
<text class="s" x="150" y="272">GRU</text><text class="s" x="300" y="272">GRU</text>

<!-- entity state -->
<rect class="bx" x="500" y="246" width="66" height="70" rx="5"/>
<g stroke="#7fa3c0" stroke-width="0.7">
  <rect x="510" y="256" width="46" height="8" fill="#dfeaf4"/><rect x="510" y="264" width="46" height="8" fill="#c9dcef"/>
  <rect x="510" y="272" width="46" height="8" fill="#e8f1f8"/><rect x="510" y="280" width="46" height="8" fill="#d4e4f2"/>
  <rect x="510" y="288" width="46" height="8" fill="#dfeaf4"/>
</g>
<text class="m" x="519" y="310">E(t)</text>
<path class="ar" d="M484 279 L496 279"/>

<!-- optional global history -->
<rect x="34" y="324" width="450" height="66" rx="8" fill="#fbfdff" stroke="#2c5f8a" stroke-width="1.2" stroke-dasharray="6 4"/>
<text class="h" x="46" y="344">Global history context <tspan class="s" font-weight="400">(optional)</tspan></text>
<text class="t" x="46" y="362">for every entity: mean over ALL its facts (o, r, x, t′), t′ &lt; t, of  E₀[x] + R[r]</text>
<text class="s" x="46" y="379">beyond the H-snapshot window · zero-initialised projection added to E₀ · never reads t′ ≥ t</text>
<path class="arB" d="M90 322 L90 306" stroke-dasharray="4 3"/>

<!-- decoder -->
<rect class="bx" x="300" y="410" width="266" height="54" rx="6"/>
<text class="h" x="312" y="431">ConvTransE decoder</text>
<text class="s" x="312" y="450">[ E(t)[s] ‖ R[r] ] → conv → fc → LayerNorm → · E(t)ᵀ</text>
<path class="ar" d="M533 318 L533 406"/>
<text class="mb" x="312" y="498">f_str(o) for every entity o</text>
<path class="arB" d="M433 466 L433 484"/>

<!-- ═════════════ QUERY + PARTITION (centre) ═════════════ -->
<rect x="596" y="64" width="370" height="452" rx="12" fill="#f7f7fa" stroke="#d3d3dd"/>
<text class="band" x="612" y="84" fill="#3c4a55">QUERY AND SUPPORT PARTITION</text>

<rect class="bx" x="612" y="98" width="150" height="48" rx="6"/>
<text class="h" x="626" y="118">query</text><text class="mb" x="626" y="137">(s, r, ?, t)</text>
<text class="s" x="778" y="112">support S(q): entities that</text>
<text class="s" x="778" y="125">met s under r, met s at all,</text>
<text class="s" x="778" y="138">or are frequent objects of r</text>

<!-- entity universe split -->
<rect x="612" y="160" width="338" height="216" rx="10" fill="#fff" stroke="#3c4a55" stroke-width="1.2"/>
<text class="s" x="624" y="176">all N entities</text>
<rect x="622" y="184" width="118" height="182" rx="8" fill="#fdf1dc" stroke="#9a6514" stroke-width="1.4"/>
<text class="h" x="634" y="204" fill="#9a6514">S</text>
<text class="s" x="652" y="204">has a history</text>
<g fill="#e3b36a" stroke="#9a6514" stroke-width="0.8">
  <circle cx="648" cy="228" r="7"/><circle cx="676" cy="240" r="7"/><circle cx="706" cy="226" r="7"/>
  <circle cx="654" cy="268" r="7"/><circle cx="694" cy="276" r="7"/><circle cx="716" cy="300" r="7"/>
  <circle cx="660" cy="316" r="7"/><circle cx="690" cy="340" r="7"/>
</g>
<circle cx="676" cy="240" r="9" fill="none" stroke="#c0392b" stroke-width="2"/>
<text class="s" x="630" y="358">a few hundred</text>
<rect x="752" y="184" width="188" height="182" rx="8" fill="#e6f0f9" stroke="#2c5f8a" stroke-width="1.4"/>
<text class="h" x="764" y="204" fill="#2c5f8a">N \ S</text>
<text class="s" x="808" y="204">no history with (s, r)</text>
<g fill="#a9c8e0" stroke="#2c5f8a" stroke-width="0.6">
  <circle cx="772" cy="226" r="5"/><circle cx="796" cy="232" r="5"/><circle cx="822" cy="224" r="5"/><circle cx="850" cy="236" r="5"/>
  <circle cx="878" cy="226" r="5"/><circle cx="906" cy="234" r="5"/><circle cx="780" cy="258" r="5"/><circle cx="808" cy="264" r="5"/>
  <circle cx="836" cy="256" r="5"/><circle cx="864" cy="266" r="5"/><circle cx="892" cy="258" r="5"/><circle cx="918" cy="268" r="5"/>
  <circle cx="774" cy="292" r="5"/><circle cx="800" cy="298" r="5"/><circle cx="828" cy="290" r="5"/><circle cx="856" cy="300" r="5"/>
  <circle cx="884" cy="292" r="5"/><circle cx="912" cy="300" r="5"/><circle cx="786" cy="326" r="5"/><circle cx="814" cy="332" r="5"/>
  <circle cx="842" cy="324" r="5"/><circle cx="870" cy="334" r="5"/><circle cx="898" cy="326" r="5"/>
</g>
<text class="s" x="764" y="358">tens of thousands</text>

<text class="t" x="612" y="400">The two sets are scored by different evidence and</text>
<text class="t" x="612" y="416">have very different sizes — so PRISM normalises</text>
<text class="t" x="612" y="432">each one on its own, instead of making both compete</text>
<text class="t" x="612" y="448">inside one softmax over all N entities.</text>
<text class="s" x="612" y="474">Ablation (3 seeds): separate normalisation +0.37 MRR</text>
<text class="s" x="612" y="488">on WIKI, +0.67 on ICEWS18 over one shared softmax,</text>
<text class="s" x="612" y="502">independent of how the mixing weight π is computed.</text>


<!-- ═════════════ HISTORY EXPERT (right) ═════════════ -->
<rect x="984" y="64" width="598" height="452" rx="12" fill="#fdf6ea" stroke="#e6cfa3"/>
<text class="band" x="1000" y="84" fill="#9a6514">HISTORY EXPERT — UNCONSTRAINED RECURRENCE INTENSITY</text>

<rect class="bx" x="1000" y="98" width="418" height="178" rx="6"/>
<text class="h" x="1012" y="117">Observed occurrence history of each candidate o ∈ S</text>
<line x1="1396" y1="126" x2="1396" y2="266" stroke="#c0392b" stroke-width="1.4" stroke-dasharray="4 3"/>
<text class="s" x="1346" y="138" fill="#c0392b">now t</text>
<g stroke="#9a6514" stroke-width="1"><line x1="1046" y1="160" x2="1392" y2="160"/><line x1="1046" y1="198" x2="1392" y2="198"/><line x1="1046" y1="236" x2="1392" y2="236"/></g>
<g fill="#c0392b"><rect x="1070" y="152" width="3.2" height="16"/><rect x="1140" y="152" width="3.2" height="16"/><rect x="1210" y="152" width="3.2" height="16"/><rect x="1280" y="152" width="3.2" height="16"/></g>
<text class="t" x="1012" y="164" fill="#c0392b">o★</text>
<text class="s" x="1150" y="181" fill="#c0392b">regular gaps, last seen earlier</text>
<g fill="#1d4e79"><rect x="1106" y="190" width="3.2" height="16"/><rect x="1116" y="190" width="3.2" height="16"/><rect x="1176" y="190" width="3.2" height="16"/><rect x="1188" y="190" width="3.2" height="16"/><rect x="1310" y="190" width="3.2" height="16"/><rect x="1370" y="190" width="3.2" height="16"/></g>
<text class="t" x="1012" y="202" fill="#1d4e79">o′</text>
<text class="s" x="1196" y="220" fill="#1d4e79">more frequent and more recent, bursty</text>
<g fill="#9a6514"><rect x="1094" y="228" width="3.2" height="16"/><rect x="1236" y="228" width="3.2" height="16"/><rect x="1330" y="228" width="3.2" height="16"/></g>
<text class="t" x="1012" y="240">o₃</text>
<text class="s" x="1012" y="257">13 statistics per candidate: count, Δt and mean gap of (s,r,o), (s,·,o), (r,·,o);</text>
<text class="s" x="1012" y="270">dispersion of the gaps, span, rate, has-history</text>

<rect x="1432" y="98" width="136" height="178" rx="6" fill="#fff" stroke="#c0392b" stroke-width="1.4"/>
<text class="h" x="1442" y="117" fill="#c0392b">Proposition 1</text>
<text class="s" x="1442" y="135">Any score non-decreasing</text>
<text class="s" x="1442" y="148">in count and non-increasing</text>
<text class="s" x="1442" y="161">in Δt ranks o′ at least as</text>
<text class="s" x="1442" y="174">high as o★, whatever its</text>
<text class="s" x="1442" y="187">parameters.</text>
<text class="s" x="1442" y="208" fill="#7a2a20">Such queries are 15.8–</text>
<text class="s" x="1442" y="221" fill="#7a2a20">41.6% of the test sets,</text>
<text class="s" x="1442" y="234" fill="#7a2a20">measured with no model.</text>
<text class="s" x="1442" y="256">The expert below is not</text>
<text class="s" x="1442" y="269">bound by it.</text>

<rect class="bx" x="1000" y="292" width="300" height="94" rx="6"/>
<text class="h" x="1012" y="312">MLP over the full statistics</text>
<text class="m" x="1012" y="333">[ LN(φ_o) ‖ u(r) ‖ v(o) ‖ w(E[s]) ]</text>
<text class="s" x="1012" y="352">two Linear–LayerNorm–GELU blocks → scalar</text>
<text class="s" x="1012" y="368">not monotone in Δt, not separable in count;</text>
<text class="s" x="1012" y="381">contains log a + p·log(1+c) − b·Δt as a special case</text>
<path class="arH" d="M1150 278 L1150 288"/>
<text class="mb" x="1320" y="344">f_rec(o),  o ∈ S</text>
<path class="arH" d="M1302 338 L1316 338"/>
<text class="s" x="1000" y="410">Restricting this expert to the monotone form, everything else fixed:</text>
<text class="t" x="1000" y="428">−1.9 MRR (YAGO) · −8.1 (WIKI) · −5.6 (ICEWS18) · −4.6 (GDELT)</text>

<!-- ═════════════ NORMALISATION + MIXTURE (bottom) ═════════════ -->
<!-- feeds: f_str down into p_N; f_str along the channel into p_S; f_rec down into p_S -->
<path class="arB" d="M400 504 L400 562"/>
<path class="arB" d="M566 524 L1300 524 L1300 562" stroke-dasharray="5 3"/>
<text class="s" x="1308" y="552" fill="#2c5f8a">f_str on S</text>
<path class="arH" d="M1426 340 L1520 340 L1520 562"/>

<rect x="18" y="534" width="1564" height="328" rx="12" fill="#f6f2fb" stroke="#d6c8ea"/>
<text class="band" x="34" y="554" fill="#6b3fa0">SEPARATE NORMALISATION AND MIXTURE — THE PREDICTIVE DISTRIBUTION</text>

<!-- p_N, under the structural expert -->
<rect class="bx" x="34" y="566" width="420" height="214" rx="8"/>
<text class="h" x="48" y="588" fill="#2c5f8a">Structural expert, normalised on N \ S</text>
<text class="m" x="48" y="609">p_N(o) = softmax over o ∉ S of f_str(o)</text>
<g fill="#4a7ba7">
  <rect x="60" y="630" width="16" height="104"/><rect x="82" y="668" width="16" height="66"/><rect x="104" y="690" width="16" height="44"/>
  <rect x="126" y="704" width="16" height="30"/><rect x="148" y="713" width="16" height="21"/><rect x="170" y="719" width="16" height="15"/>
  <rect x="192" y="723" width="16" height="11"/><rect x="214" y="726" width="16" height="8"/><rect x="236" y="728" width="16" height="6"/>
  <rect x="258" y="730" width="16" height="4"/><rect x="280" y="731" width="16" height="3"/>
</g>
<line x1="54" y1="734" x2="440" y2="734" stroke="#1f2a33"/>
<text class="s" x="306" y="728">… tens of thousands</text>
<text class="s" x="48" y="752">sums to 1 over entities with no history: structure ranks</text>
<text class="s" x="48" y="766">only the candidates that it alone can score</text>

<!-- p_S, under the history expert -->
<rect class="bx" x="1146" y="566" width="420" height="214" rx="8"/>
<text class="h" x="1160" y="588" fill="#9a6514">History expert, normalised on S</text>
<text class="m" x="1160" y="609">p_S(o) = softmax over o ∈ S of log( e<tspan dy="-5" font-size="8">f_str</tspan><tspan dy="5"> + e</tspan><tspan dy="-5" font-size="8">f_rec</tspan><tspan dy="5"> )</tspan></text>
<g>
  <rect x="1172" y="630" width="26" height="104" fill="#c0392b"/><rect x="1206" y="664" width="26" height="70" fill="#e3b36a"/>
  <rect x="1240" y="692" width="26" height="42" fill="#e3b36a"/><rect x="1274" y="708" width="26" height="26" fill="#e3b36a"/>
  <rect x="1308" y="718" width="26" height="16" fill="#e3b36a"/><rect x="1342" y="724" width="26" height="10" fill="#e3b36a"/>
  <rect x="1376" y="728" width="26" height="6" fill="#e3b36a"/>
</g>
<line x1="1166" y1="734" x2="1552" y2="734" stroke="#1f2a33"/>
<text class="s" x="1176" y="626" fill="#c0392b">o★</text>
<text class="s" x="1160" y="752">sums to 1 over S: historical candidates compete only</text>
<text class="s" x="1160" y="766">with each other, never with the entities outside S</text>

<!-- mixture, in the middle -->
<rect x="474" y="566" width="652" height="214" rx="8" fill="#fff" stroke="#6b3fa0" stroke-width="2"/>
<text class="h" x="490" y="588" fill="#6b3fa0">Mixture: an exact distribution over all N entities</text>
<text class="mb" x="490" y="612">P(o | q) = π · p_S(o)  if o ∈ S,     (1 − π) · p_N(o)  otherwise</text>
<text class="s" x="490" y="630">π = σ(ρ): one learned scalar; a query-dependent router does no better</text>
<g>
  <rect x="504" y="648" width="22" height="86" fill="#c0392b"/><rect x="532" y="678" width="22" height="56" fill="#e3b36a"/>
  <rect x="560" y="700" width="22" height="34" fill="#e3b36a"/><rect x="588" y="713" width="22" height="21" fill="#e3b36a"/>
  <rect x="616" y="721" width="22" height="13" fill="#e3b36a"/>
  <rect x="652" y="700" width="18" height="34" fill="#4a7ba7"/><rect x="674" y="714" width="18" height="20" fill="#4a7ba7"/>
  <rect x="696" y="721" width="18" height="13" fill="#4a7ba7"/><rect x="718" y="725" width="18" height="9" fill="#4a7ba7"/>
  <rect x="740" y="728" width="18" height="6" fill="#4a7ba7"/><rect x="762" y="730" width="18" height="4" fill="#4a7ba7"/>
</g>
<line x1="498" y1="734" x2="800" y2="734" stroke="#1f2a33"/>
<text class="s" x="508" y="752" fill="#9a6514">π · p_S</text><text class="s" x="668" y="752" fill="#2c5f8a">(1 − π) · p_N</text>
<text class="s" x="490" y="770">the answer o★ is ranked against all N entities by P(o | q)</text>

<rect x="830" y="644" width="282" height="124" rx="6" fill="#faf7fd" stroke="#d6c8ea"/>
<text class="h" x="842" y="664">Training and inference</text>
<text class="t" x="842" y="684">loss = −log P(o★ | q)</text>
<text class="s" x="842" y="700">one exactly normalised likelihood,</text>
<text class="s" x="842" y="713">no auxiliary losses</text>
<text class="t" x="842" y="734">evaluation: time-aware filtered,</text>
<text class="s" x="842" y="750">ties at their average position;</text>
<text class="s" x="842" y="763">one softmax is the special case</text>

<path class="arM" d="M456 690 L470 690"/>
<path class="arM" d="M1144 690 L1130 690"/>

<text class="s" x="34" y="808">A single softmax scores S and N \ S in one normalisation, so one set of logits must order the historical candidates among themselves and, at the same time,</text>
<text class="s" x="34" y="822">against every entity without a history. Normalising the two separately removes that coupling — the mechanism by which a mixture of softmaxes relaxes a single one.</text>
<text class="s" x="34" y="848">Colours: blue = structural evidence · amber = history evidence · red = the answer o★ · purple = the mixture.</text>
</svg>
